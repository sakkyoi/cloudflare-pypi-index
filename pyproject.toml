[project]
name = "cloudflare-pypi-index"
version = "0.1.0"
description = "Publish Python distributions and host a Simple Repository API on Cloudflare Workers and R2."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.62",
]

[project.scripts]
cloudflare-pypi = "r2_index_publisher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2_index_publisher"]
