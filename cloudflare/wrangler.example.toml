name = "cloudflare-pypi-index"
main = "src/public-worker.ts"
compatibility_date = "2026-07-08"

[[r2_buckets]]
binding = "INDEX_BUCKET"
bucket_name = "your-r2-bucket-name"

[[queues.consumers]]
queue = "your-r2-event-queue-name"
max_batch_size = 10
max_batch_timeout = 5

[[durable_objects.bindings]]
name = "PROJECT_INDEX"
class_name = "ProjectIndexDO"

[[durable_objects.bindings]]
name = "AUTH_STORE"
class_name = "AuthStoreDO"

[[migrations]]
tag = "create-project-index-do"
new_sqlite_classes = ["ProjectIndexDO"]

[[migrations]]
tag = "create-auth-store-do"
new_sqlite_classes = ["AuthStoreDO"]
